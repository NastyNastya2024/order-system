<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harry Potter Heroes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card-container">
        <div class="card">
            <img src="test/garry.jpeg" alt="Harry Potter">
            <h2>Harry Potter</h2>
            <p>The Boy Who Lived, known for his courage and loyalty.</p>
        </div>
        <div class="card">
            <img src="test/mony.jpeg" alt="Hermione Granger">
            <h2>Hermione Granger</h2>
            <p>A brilliant witch, always prepared with a spell or a plan.</p>
        </div>
        <div class="card">
            <img src="test/ron_u.jpeg" alt="Ron Weasley">
            <h2>Ron Weasley</h2>
            <p>Harry's loyal friend, known for his humor and bravery.</p>
        </div>
    </div>
</body>
</html>
